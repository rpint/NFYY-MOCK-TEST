[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital_mock_mcp500"
version = "0.1.3"                          # 升级版本号到 0.1.3
description = "Hospital mock MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",                      # 关键改动：指定支持 FastMCP 的版本
]

[project.scripts]
hospital_mock_mcp500 = "my_mock_server.server:main"
hospital-mock-mcp500 = "my_mock_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_mock_server"]
