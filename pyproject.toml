[project]
name = "pediatric-renal-nutrition-mcp"
version = "1.0.0"
description = "童肾营养师辅助决策数据查询 MCP 服务 —— 提供儿童肾脏病营养模拟数据查询"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
pediatric-renal-nutrition-mcp = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
