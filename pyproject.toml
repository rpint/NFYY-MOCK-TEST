[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital_mock_mcp500"
version = "0.1.1"                        # 1. 版本号必须改为 0.1.1（PyPI 不允许覆盖 0.1.0）
description = "Hospital mock MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
hospital_mock_mcp500 = "my_mock_server.server:main"  # 2. 核心修改：命令名改为与包名完全一致！

[tool.hatch.build.targets.wheel]
packages = ["src/my_mock_server"]
