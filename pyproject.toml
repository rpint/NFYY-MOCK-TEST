[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hospital-mock-mcp"         # 1. 你的 PyPI 包名（必须在 PyPI 上全局唯一，随便改个独一无二的名字）
version = "0.1.0"
description = "Mock MCP Server for Hospital Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",                  # 你的代码依赖的第三方库
]

[project.scripts]
hospital-mock-mcp = "my_mock_server.server:main" # 2. 命令名 = 文件夹名.文件名:主入口函数
